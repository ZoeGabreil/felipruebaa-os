<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Línea del tiempo</title>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;0,800;1,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; margin: 0; font-family: 'Alegreya', serif; background: #09120b; color: #f3f5ee; overflow-x: hidden; }
    body { min-height: calc(100 * min(var(--vh, 1vh), 1vh)); }
    .page { padding: 1.5rem; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .arrow-small { display: inline-flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.9); background: linear-gradient(135deg, rgba(95,168,98,0.95), rgba(255,255,255,0.88)); color: #1f4120; font-size: 1.7rem; text-decoration: none; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .arrow-small:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(0,0,0,0.18); }
    .title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3rem); color: #e8f5e1; margin-bottom: 0.75rem; text-align: center; }
    .line { height: 4px; border-radius: 999px; background: linear-gradient(90deg, #66bb6a, #fdd835, #66bb6a); margin: 1rem 0; }
    .timeline { display: grid; gap: 1rem; }
    .timeline-row { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .timeline-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; overflow: hidden; width: min(280px, 100%); box-shadow: 0 20px 50px rgba(0,0,0,0.18); }
    .timeline-card img { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; }
    .badge { display: inline-flex; padding: 0.4rem 1rem; background: #2e7d32; color: #fff; border-radius: 999px; margin: 0.8rem; font-weight: 700; }
    .caption { padding: 0 1rem 1rem; color: #d9e7d0; line-height: 1.7; }
    @media (max-width: 720px) { .topbar { flex-direction: column; gap: 1rem; } .timeline-row { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="arrow-small" href="carta.html" aria-label="Volver a la carta">←</a>
      <a class="arrow-small" href="galeria.html" aria-label="Ir a la galería">→</a>
    </div>
    <h1 class="title">Línea del tiempo</h1>
    <div class="line"></div>
    <div class="timeline">
      <div class="timeline-row">
        <div class="timeline-card">
          <span class="badge">2020</span>
          <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=600&q=80" alt="Recuerdo 2020">
          <div class="caption">Un momento de aventura y risas.</div>
        </div>
        <div class="timeline-card">
          <span class="badge">2021</span>
          <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=600&q=80" alt="Recuerdo 2021">
          <div class="caption">Días de amistad y nuevas historias.</div>
        </div>
      </div>
      <div class="timeline-row">
        <div class="timeline-card">
          <span class="badge">2022</span>
          <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d0f2?auto=format&fit=crop&w=600&q=80" alt="Recuerdo 2022">
          <div class="caption">Pequeños instantes que se convirtieron en grandes recuerdos.</div>
        </div>
        <div class="timeline-card">
          <span class="badge">2023</span>
          <img src="https://images.unsplash.com/photo-1493815753586-7dcd616b1b5b?auto=format&fit=crop&w=600&q=80" alt="Recuerdo 2023">
          <div class="caption">Momentos llenos de color, naturaleza y calma.</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function(){
      let audioCtx;
      function playClick(){
        try{
          if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.value = 880 + Math.random() * 180;
          o.connect(g); g.connect(audioCtx.destination);
          const now = audioCtx.currentTime;
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(0.11, now + 0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
          o.start(now);
          o.stop(now + 0.12);
        }catch(e){}
      }
      document.addEventListener('click', function(e){
        const el = e.target.closest('button, a, [role="button"], .action-button, .arrow-button, .arrow-small, .nav-left, .nav-right, .moving-btn');
        if(el) playClick();
      }, true);
    })();
  </script>
</body>
</html>
